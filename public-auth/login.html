<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | auria</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f6f9;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --gradient: linear-gradient(135deg, #14b8a6, #0ea5e9);
    --error-bg: #fef2f2;
    --error-border: #fca5a5;
    --error-text: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--text);
  }
  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 12px 32px -12px rgba(15, 23, 42, 0.12);
    text-align: center;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .brand-logo { width: 40px; height: 40px; }
  .brand-name {
    font-family: "Plus Jakarta Sans", "Trebuchet MS", "Yu Gothic", sans-serif;
    font-size: 1.7rem;
    font-weight: 700;
    color: #2b3358;
  }
  .desc {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 28px;
    line-height: 1.6;
  }

  a.login-btn {
    display: block;
    width: 100%;
    background: var(--gradient);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }

  .error {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error-text);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
    text-align: left;
  }
  .error.visible { display: block; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <img class="brand-logo" src="logo.png" alt="auria">
      <span class="brand-name">auria</span>
    </div>
    <p class="desc">社内共通のGROUP BOARDアカウントでログインします。</p>

    <div id="error" class="error"></div>

    <a id="login-btn" class="login-btn" href="#">GROUP BOARDでログイン</a>
  </div>

<script>
  const errorEl = document.getElementById("error");
  const loginBtn = document.getElementById("login-btn");

  function getSafeNextPath() {
    const next = new URLSearchParams(window.location.search).get("next");
    if (!next || !next.startsWith("/") || next.startsWith("//")) return "/";
    return next;
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get("error")) {
    errorEl.textContent = "ログインに失敗しました。もう一度お試しください。";
    errorEl.classList.add("visible");
  }

  loginBtn.href = "/api/auth/sso?next=" + encodeURIComponent(getSafeNextPath());
</script>
</body>
</html>
